<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg2)"/>
  <circle cx="200" cy="150" r="120" fill="rgba(56, 189, 248, 0.2)" filter="blur(20px)" />
  <circle cx="600" cy="350" r="140" fill="rgba(14, 165, 233, 0.25)" filter="blur(20px)" />

  <rect x="120" y="80" width="560" height="340" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" style="backdrop-filter: blur(10px);" />
  
  <text x="160" y="140" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="bold">Pulse-UI Component System</text>
  <text x="160" y="175" fill="#93c5fd" font-family="sans-serif" font-size="16">Accessible, themeable, high-performance React UI library</text>

  <!-- UI Tokens Showcase -->
  <rect x="160" y="210" width="140" height="48" rx="24" fill="#38bdf8" />
  <text x="230" y="240" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Primary Button</text>

  <rect x="320" y="210" width="140" height="48" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" />
  <text x="390" y="240" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Outline Button</text>

  <rect x="480" y="210" width="160" height="48" rx="12" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" />
  <text x="560" y="240" fill="#e0f2fe" font-family="sans-serif" font-size="14" text-anchor="middle">Input Control...</text>

  <rect x="160" y="280" width="480" height="100" rx="12" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(56, 189, 248, 0.3)" />
  <text x="190" y="320" fill="#7dd3fc" font-family="monospace" font-size="14">&lt;Button variant="glow" size="lg"&gt;</text>
  <text x="210" y="345" fill="#e0f2fe" font-family="monospace" font-size="14">Launch Project</text>
  <text x="190" y="370" fill="#7dd3fc" font-family="monospace" font-size="14">&lt;/Button&gt;</text>
</svg>
