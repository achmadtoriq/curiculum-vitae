<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg1)"/>
  <!-- Decorative Grid -->
  <path d="M 0 100 L 800 100 M 0 200 L 800 200 M 0 300 L 800 300 M 0 400 L 800 400" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  <path d="M 200 0 L 200 500 M 400 0 L 400 500 M 600 0 L 600 500" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  
  <!-- Dashboard Wireframe -->
  <rect x="80" y="70" width="640" height="360" rx="12" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <rect x="80" y="70" width="640" height="44" rx="12" fill="rgba(255,255,255,0.05)" />
  <circle cx="110" cy="92" r="6" fill="#ef4444" />
  <circle cx="130" cy="92" r="6" fill="#f59e0b" />
  <circle cx="150" cy="92" r="6" fill="#10b981" />
  <rect x="180" y="84" width="240" height="16" rx="8" fill="rgba(255,255,255,0.1)" />

  <!-- Analytics Cards -->
  <rect x="110" y="140" width="170" height="90" rx="8" fill="rgba(99, 102, 241, 0.15)" stroke="url(#card1)" stroke-width="1.5" />
  <text x="130" y="175" fill="#a5b4fc" font-family="sans-serif" font-size="14" font-weight="600">Total Revenue</text>
  <text x="130" y="210" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">$128,450</text>

  <rect x="300" y="140" width="170" height="90" rx="8" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5" />
  <text x="320" y="175" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="600">Active Users</text>
  <text x="320" y="210" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">42,890</text>

  <rect x="490" y="140" width="200" height="90" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" />
  <text x="510" y="175" fill="#6ee7b7" font-family="sans-serif" font-size="14" font-weight="600">Conversion Rate</text>
  <text x="510" y="210" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">4.85% (+12%)</text>

  <!-- Chart Graphics -->
  <path d="M 120 370 Q 200 300 280 340 T 440 270 T 600 310 T 670 250" fill="none" stroke="#6366f1" stroke-width="4" />
  <path d="M 120 370 Q 200 300 280 340 T 440 270 T 600 310 T 670 250 L 670 390 L 120 390 Z" fill="rgba(99, 102, 241, 0.1)" />
</svg>
